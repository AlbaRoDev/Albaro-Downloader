# Proposes updates (as pull requests) for what the app is built from: the pinned GitHub Actions,
# the Rust crates and the npm packages. Nothing is merged without review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
